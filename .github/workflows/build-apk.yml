name: Build APK

# 手动触发：Actions -> Build APK -> Run workflow
# 选分支（mod/archive / main），版本号留空自动生成。
# 产物：每次 run 的 Artifacts + 自动发布到 Releases（可在 create_release 关掉）。
# 不向上游 rimvoid/legado 提 PR，只在本仓库发 Release。

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName，留空自动用 3.26.MMDDHHmm"
        required: false
        default: ""
      version_code:
        description: "versionCode；留空自动生成（Unix 分钟数+10000000，递增且大于 35500036）"
        required: false
        default: ""
      abi:
        description: "ABI（只出 arm64-v8a 就够）"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
      create_release:
        description: "构建完成后自动发布到 Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Resolve version
        id: ver
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then
            NAME="3.26.$(TZ=Asia/Shanghai date +%m%d%H%M)"
          fi
          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            # 自动版本号：Unix 分钟数 + 10000000。加偏移是因为历史版本用 35500036 这类高位
            # 数字，直接用时间戳（约 2990 万）会小于已装版本，手机会拒绝降级安装。
            CODE=$(( $(date -u +%s) / 60 + 10000000 ))
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次 versionName=$NAME versionCode=$CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "abi=${{ inputs.abi }}" >> "$GITHUB_OUTPUT"

      - name: Sanitize Gradle AAPT2 caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native

      - name: Build release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-XX:+UseParallelGC\ -Xmx4g\ -Xms256m\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
            -Dorg.gradle.workers.max=2
        run: |
          mkdir -p out
          ./gradlew :app:assembleAppRelease \
            -Pabi=${{ steps.ver.outputs.abi }} \
            -PVERSION_NAME=${{ steps.ver.outputs.name }} \
            -PVERSION_CODE=${{ steps.ver.outputs.code }} \
            -PRELEASE_STORE_FILE=ci-debug.keystore \
            -PRELEASE_STORE_PASSWORD=legado-ci-debug \
            -PRELEASE_KEY_ALIAS=legado-ci-debug \
            -PRELEASE_KEY_PASSWORD=legado-ci-debug \
            -x lintVitalAnalyzeAppRelease -x lintVitalReportAppRelease -x lintVitalAppRelease \
            --no-daemon --max-workers=2 --stacktrace
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-${{ steps.ver.outputs.abi }}-${{ steps.ver.outputs.code }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ steps.ver.outputs.code }}"
          TITLE="阅读 Archive ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
          cat > release-notes.md <<EOF
          versionName: ${{ steps.ver.outputs.name }}
          versionCode: ${{ steps.ver.outputs.code }}
          ABI: ${{ steps.ver.outputs.abi }}
          Commit: ${{ github.sha }}
          Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber -R "${{ github.repository }}"
            gh release edit "$TAG" --notes-file release-notes.md -R "${{ github.repository }}"
          else
            gh release create "$TAG" out/*.apk --title "$TITLE" --notes-file release-notes.md -R "${{ github.repository }}"
          fi
